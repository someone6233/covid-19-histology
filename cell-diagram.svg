<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Simplified animal cell diagram</title>
  <desc id="desc">A clean scientific-style diagram showing the cell membrane, cytoplasm, nucleus, and mitochondria.</desc>
  <defs>
    <radialGradient id="cell" cx="45%" cy="40%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dceff3"/>
    </radialGradient>
    <radialGradient id="nucleus" cx="45%" cy="40%">
      <stop offset="0%" stop-color="#d9d1ff"/>
      <stop offset="100%" stop-color="#8c7be8"/>
    </radialGradient>
  </defs>
  <ellipse cx="450" cy="300" rx="370" ry="235" fill="url(#cell)" stroke="#6657d9" stroke-width="16"/>
  <ellipse cx="450" cy="300" rx="330" ry="200" fill="none" stroke="#46b7c8" stroke-width="3" opacity=".5"/>
  <ellipse cx="450" cy="305" rx="105" ry="92" fill="url(#nucleus)" stroke="#5141b9" stroke-width="8"/>
  <circle cx="450" cy="305" r="28" fill="#5141b9" opacity=".65"/>
  <text x="450" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#5141b9">NUCLEUS</text>

  <g fill="#e9b6c7" stroke="#9b5c78" stroke-width="5">
    <ellipse cx="230" cy="190" rx="55" ry="25" transform="rotate(-25 230 190)"/>
    <ellipse cx="650" cy="200" rx="55" ry="25" transform="rotate(22 650 200)"/>
    <ellipse cx="670" cy="390" rx="55" ry="25" transform="rotate(-18 670 390)"/>
    <ellipse cx="260" cy="405" rx="55" ry="25" transform="rotate(18 260 405)"/>
  </g>
  <g fill="none" stroke="#7c4560" stroke-width="5">
    <path d="M195 190 C220 170 240 210 270 190"/>
    <path d="M615 200 C640 180 665 220 695 198"/>
    <path d="M635 390 C660 370 680 410 710 390"/>
    <path d="M225 405 C250 385 270 425 300 405"/>
  </g>

  <text x="720" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172033">CELL MEMBRANE</text>
  <line x1="710" y1="125" x2="735" y2="175" stroke="#172033" stroke-width="4"/>

  <text x="120" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172033">MITOCHONDRIA</text>
  <line x1="175" y1="500" x2="235" y2="425" stroke="#172033" stroke-width="4"/>

  <text x="760" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172033">CYTOPLASM</text>
  <line x1="705" y1="480" x2="620" y2="410" stroke="#172033" stroke-width="4"/>
</svg>
